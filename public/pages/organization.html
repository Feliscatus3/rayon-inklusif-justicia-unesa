<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struktur Organisasi - Kader Panel PMII Justicia</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.org-container{max-width:1200px;margin:0 auto;padding:20px 24px}
.org-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;background:#fff;padding:16px 20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nr{display:flex;align-items:center;gap:10px}
.bb{color:rgba(255,255,255,.9);text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px}
.bb:hover{background:rgba(255,255,255,.15);color:#fff}
.leadership-row{display:flex;justify-content:center;align-items:stretch;gap:20px;flex-wrap:wrap;margin-bottom:40px}
.leader-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;width:220px;text-align:center;transition:.3s;border:1px solid #eee}
.leader-card:hover{transform:translateY(-6px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.leader-card.ketua{border:2px solid var(--primary);box-shadow:0 4px 20px rgba(26,35,126,.15)}
.leader-card.ketua .lc-badge{background:var(--primary)}
.leader-card .lc-badge{background:#757575;color:#fff;padding:4px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.leader-card .lc-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:16px auto 8px;display:block;border:3px solid #f0f0f0}
.leader-card.ketua .lc-photo{border-color:var(--primary)}
.leader-card h3{font-size:1rem;margin:4px 0 2px;font-weight:700}
.leader-card .lc-pos{font-size:.8rem;color:var(--primary);font-weight:600;margin-bottom:4px}
.leader-card .lc-dept{font-size:.75rem;color:#999;margin-bottom:12px}
.section-title{font-size:1.4rem;font-weight:700;color:var(--primary);margin:32px 0 20px;padding-bottom:10px;border-bottom:3px solid var(--primary);display:flex;align-items:center;gap:10px}
.div-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-bottom:32px}
.div-card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;border:1px solid #eee;transition:.2s}
.div-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.div-card-head{padding:14px 18px;background:linear-gradient(135deg,var(--primary),#283593);color:#fff;display:flex;align-items:center;gap:10px}
.div-card-head h3{font-size:1rem;font-weight:700;margin:0;flex:1}
.div-card-body{padding:14px 18px}
.div-member{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.div-member:last-child{border-bottom:none}
.div-member-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#999;flex-shrink:0}
.div-member-info{flex:1;min-width:0}
.div-member-info h4{font-size:.85rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.div-member-info .dm-pos{font-size:.75rem;color:var(--primary);font-weight:500}
.div-member-info .dm-dept{font-size:.7rem;color:#999}
.div-member-role{font-size:.7rem;padding:2px 10px;border-radius:10px;font-weight:600;text-transform:uppercase;flex-shrink:0}
.div-member-role.kabid{background:#e8f0fe;color:var(--primary)}
.div-member-role.wakabid{background:#fff3e0;color:#e65100}
.div-member-role.anggota{background:#f5f5f5;color:#757575}
.combined-section{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.combined-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid #eee;transition:.2s}
.combined-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--primary)}
.combined-card .cc-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #f0f0f0;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#999;font-weight:600}
.combined-card .cc-info{flex:1;min-width:0}
.combined-card .cc-info h4{font-size:.9rem;font-weight:600;margin:0}
.combined-card .cc-info .cc-pos{font-size:.8rem;color:var(--primary);font-weight:500}
.combined-card .cc-info .cc-dept{font-size:.75rem;color:#999}
.combined-card .cc-badge{padding:4px 12px;border-radius:12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.combined-card .cc-badge.ketua{background:var(--primary);color:#fff}
.combined-card .cc-badge.sekretaris{background:#2e7d32;color:#fff}
.combined-card .cc-badge.bendahara{background:#e65100;color:#fff}
.empty-state{text-align:center;padding:60px 20px;color:#999}
.empty-state i{font-size:3rem;margin-bottom:12px;display:block}
.loading-skeleton{display:flex;justify-content:center;align-items:center;min-height:200px;color:#999}
.loading-skeleton i{font-size:2rem;margin-right:12px;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
@media(max-width:768px){.leadership-row{gap:14px}.leader-card{width:160px}.leader-card .lc-photo{width:80px;height:80px}.leader-card h3{font-size:.9rem}.div-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="dashboard-nav"><div class="nav-container">
<h2><i class="fas fa-sitemap"></i> Struktur Organisasi</h2>
<div class="nr">
<a href="dashboard.html" class="bb"><i class="fas fa-arrow-left"></i> Dashboard</a>
<button id="lo" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Keluar</button>
</div></nav>
<main class="org-container">
<div class="org-bar"><h2 style="font-size:1.3rem;color:var(--primary);margin:0"><i class="fas fa-sitemap"></i> Struktur Kepengurusan</h2>
<button id="ref" class="btn-logout" style="background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer"><i class="fas fa-sync-alt"></i> Segarkan</button></div>
<div id="load" class="loading-skeleton"><i class="fas fa-spinner"></i> Memuat data...</div>
<div id="cont" style="display:none">
<h3 class="section-title"><i class="fas fa-star"></i> Pimpinan Inti</h3><div id="lead" class="leadership-row"></div>
<h3 class="section-title"><i class="fas fa-users"></i> Seluruh Struktur</h3><div id="comb" class="combined-section"></div>
<h3 class="section-title"><i class="fas fa-layer-group"></i> Bidang-Bidang</h3><div id="divs" class="div-grid"></div>
</main>
<script>
function $(i){return document.getElementById(i)}
function gI(n){if(!n)return'?';return n.split(" ").map(function(w){return w[0]}).join("").substring(0,2).toUpperCase()}
function rL(r){var m={ketua_rayon:'Ketua Rayon',sekretaris:'Sekretaris',bendahara:'Bendahara',kabid:'Ketua Bidang',wakabid:'Wakil Ketua Bidang',anggota:'Anggota',kader:'Kader',super_admin:'Super Admin',admin:'Admin'};return m[r]||r}
function rB(r){if(r==='ketua_rayon')return'ketua';if(r==='sekretaris')return'sekretaris';if(r==='bendahara')return'bendahara';return''}
function dR(r){if(r==='kabid')return'Kabid';if(r==='wakabid')return'Wakabid';return'Anggota'}
function gA(m){if(m.foto_url)return'<img class="div-member-avatar" src="'+m.foto_url+'" alt="'+m.full_name+'">';return'<div class="div-member-avatar">'+gI(m.full_name)+'</div>'}
function gAS(m){if(m.foto_url)return'<img class="cc-avatar" src="'+m.foto_url+'" alt="'+m.full_name+'">';return'<div class="cc-avatar">'+gI(m.full_name)+'</div>'}
document.addEventListener('DOMContentLoaded',async function(){
try{var r=await fetch('/api/auth/me',{credentials:'include'});var d=await r.json();if(!d.authenticated){window.location.href='../panel.html';return}}catch(e){window.location.href='../panel.html';return}
  $('lo').onclick=async function(){await fetch('/api/auth/logout',{method:'POST',credentials:'include'});window.location.href='../panel.html'};
  $('ref').onclick=load;await load()});
async function load(){
  $('load').style.display='flex';$('cont').style.display='none';
  try{var r=await fetch('/api/organization',{credentials:'include'});var d=await r.json();rLd(d.leadership);rC(d.leadership,d.divisions);rD(d.divisions);$('load').style.display='none';$('cont').style.display='block'}
  catch(e){$('load').innerHTML='<i class="fas fa-exclamation-triangle" style="color:#c62828"></i> Gagal'}}
function rLd(leaders){var h='';if(!leaders||leaders.length===0){h='<div class="empty-state"><i class="fas fa-user-tie"></i><p>Belum ada pimpinan inti</p></div>'}else{for(var i=0;i<leaders.length;i++){var l=leaders[i];var ik=l.role==='ketua_rayon';var a=l.foto_url?'<img class="lc-photo" src="'+l.foto_url+'" alt="'+l.full_name+'">':'<div class="lc-photo" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#999;font-weight:700">'+gI(l.full_name)+'</div>';h+='<div class="leader-card'+(ik?' ketua':'')+'"><div class="lc-badge">'+rL(l.role)+'</div>'+a+'<h3>'+l.full_name+'</h3><div class="lc-pos">'+rL(l.role)+'</div>'+(l.universitas?'<div class="lc-dept">'+l.universitas+'</div>':'')+'</div>'}}$('lead').innerHTML=h}
function rC(leaders,divs){var h='';var all=[];if(leaders){for(var i=0;i<leaders.length;i++){all.push({m:leaders[i],o:i,s:'pimpinan'})}}if(divs){for(var di=0;di<divs.length;di++){var d=divs[di];if(d.members){for(var mi=0;mi<d.members.length;mi++){all.push({m:d.members[mi],o:di*100+mi,s:d.name,dR:d.members[mi].division_role})}}}}if(all.length===0){h='<div class="empty-state"><i class="fas fa-users"></i><p>Belum ada anggota</p></div>'}else{for(var i=0;i<all.length;i++){var x=all[i];var m=x.m;var bc='';var bt='';if(x.s==='pimpinan'){bc=rB(m.role);bt=rL(m.role)}else{bt=dR(x.dR);if(x.dR==='kabid')bc='ketua';else if(x.dR==='wakabid')bc='bendahara'}h+='<div class="combined-card">'+gAS(m)+'<div class="cc-info"><h4>'+m.full_name+'</h4><div class="cc-pos">'+(x.s==='pimpinan'?rL(m.role):x.s)+'</div><div class="cc-dept">'+rL(m.role)+(m.universitas?' - '+m.universitas:'')+'</div><div class="cc-badge '+bc+'">'+bt+'</div>'}}$('comb').innerHTML=h}
function rD(divs){var h='';if(!divs||divs.length===0){h='<div class="empty-state"><i class="fas fa-layer-group"></i><p>Belum ada bidang</p></div>'}else{for(var di=0;di<divs.length;di++){var d=divs[di];var ms=d.members||[];h+='<div class="div-card"><div class="div-card-head"><h3>'+d.name+'</h3><span>'+ms.length+' anggota</span></div><div class="div-card-body">';if(ms.length===0){h+='<div style="padding:12px;text-align:center;color:#999;font-size:.85rem">Belum ada anggota</div>'}else{for(var mi=0;mi<ms.length;mi++){var m=ms[mi];h+='<div class="div-member">'+gA(m)+'<div class="div-member-info"><h4>'+m.full_name+'</h4><div class="dm-pos">'+rL(m.role)+'</div>'+(m.universitas?'<div class="dm-dept">'+m.universitas+'</div>':'')+'</div><div class="div-member-role '+(m.division_role||'anggota')+'">'+dR(m.division_role)+'</div>'}}h+='</div>'}}$('divs').innerHTML=h}
</script>
</body>
</html>
