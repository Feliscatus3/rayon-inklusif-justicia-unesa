<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman - Kader Panel PMII Justicia</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/announcement-popup.css">
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo" id="sbLogo"><i class="fas fa-people-arrows"></i></div>
      <div class="brand-text">
        <h2 id="sbName">Kader Panel</h2>
        <small id="sbOrg">PMII Justicia UNESA</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-label">Menu</div>
      <a class="sidebar-link" href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a class="sidebar-link" href="users.html"><i class="fas fa-users"></i> Manajemen Pengguna</a>
      <a class="sidebar-link" href="calendar.html"><i class="fas fa-calendar-days"></i> Event</a>
      <a class="sidebar-link active" href="announcements.html"><i class="fas fa-bullhorn"></i> Pengumuman</a>
      <div class="sidebar-label">Lainnya</div>
      <a class="sidebar-link" href="settings.html"><i class="fas fa-cog"></i> Pengaturan</a>
      <a class="sidebar-link" id="logoutBtn" href="#"><i class="fas fa-sign-out-alt"></i> Keluar</a>
    </nav>
    <div class="sidebar-footer">PMII Rayon Justicia &copy; 2025</div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
        <div class="topbar-title"><i class="fas fa-bullhorn"></i> Pengumuman</div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle" title="Ganti tema"><i class="fas fa-moon"></i><i class="fas fa-sun"></i></button>
        <div class="topbar-user" id="userChip">
          <div class="u-avatar" id="userAvatar">K</div>
          <div class="u-info">
            <div class="u-name" id="userName">Kader</div>
            <div class="u-role" id="userRole">-</div>
          </div>
        </div>
      </div>
    </header>
    <main class="dash-content">
      <div class="page-head">
        <h1 class="page-title"><i class="fas fa-bullhorn"></i> Pengumuman</h1>
        <p class="page-subtitle">Kelola informasi dan pengumuman untuk seluruh kader.</p>
      </div>
<div class="an-bar"><div class="sb">
<input type="text" id="srch" placeholder="Cari...">
<select id="cf"><option value="">Semua</option><option>Umum</option><option>Kegiatan</option><option>Pendidikan</option><option>Organisasi</option><option>Kaderisasi</option><option>KOPRI</option><option>Lembaga</option><option>External</option></select>
</div><button id="ab" class="cp" style="display:none"><i class="fas fa-plus"></i> Tambah Pengumuman</button></div>
<div id="ag" class="an-grid"></div>
<div id="fm" class="mod"><div class="mc"><span class="mx">&times;</span><h3 id="ft">Pengumuman Baru</h3>
<form id="ef"><input type="hidden" id="ei">
<div class="fg"><label>Judul *</label><input type="text" id="et" required></div>
<div class="fg"><label>Konten *</label><textarea id="ec" rows="6" required></textarea></div>
<div class="fg"><label>Kategori</label><select id="ecc"><option>Umum</option><option>Kegiatan</option><option>Pendidikan</option><option>Organisasi</option><option>Kaderisasi</option><option>KOPRI</option><option>Lembaga</option><option>External</option></select></div>
<div class="fg"><label><input type="checkbox" id="ep"> Pin pengumuman</label></div>
<div class="fa"><button type="submit" class="cp" id="fsb">Simpan</button><button type="button" class="cc" id="fc">Batal</button></div>
</form></div>
<div id="toast" class="toast"></div>
    </main>
  </div>
</div>
<script>
function initials(n){if(!n)return '?';return n.trim().split(/\s+/).map(function(w){return w[0]}).join('').substring(0,2).toUpperCase();}
function capRole(r){if(!r)return '-';return r.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()});}
/* ===== Theme ===== */
(function initTheme(){
  var saved=localStorage.getItem('theme');
  if(saved==='dark'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
$('themeToggle').addEventListener('click',function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');}
});
/* ===== Hamburger ===== */
$('hamburger').addEventListener('click',function(){ $('sidebar').classList.toggle('open'); });
document.addEventListener('click',function(e){
  if(window.innerWidth<=768 && !e.target.closest('.sidebar') && !e.target.closest('.hamburger')){
    $('sidebar').classList.remove('open');
  }
});
var ADMIN_ROLES=['super_admin','admin'];var an=[],cu=null,csrfToken=null;
function $(i){return document.getElementById(i)}
function getCsrfToken(){return csrfToken||null;}
function isAdmin(){
  if(!cu)return false;
  if(ADMIN_ROLES.indexOf(cu.role)>=0)return true;
  if(cu.privilege==='super_admin'||cu.privilege==='admin')return true;
  return false;
}
document.addEventListener('DOMContentLoaded',async function(){
  try{var r=await fetch('/api/auth/me',{credentials:'include'});var d=await r.json();
    if(!d.authenticated){window.location.href='../panel.html';return;}
    cu=d.user;csrfToken=d.csrfToken||null;if(isAdmin())$('ab').style.display='inline-flex';
    var uname=cu.full_name||cu.username||'Kader';
    $('userName').textContent=uname;
    $('userRole').textContent=capRole(cu.role);
    $('userAvatar').textContent=initials(uname);
  }catch(e){window.location.href='../panel.html';return;}
  await loadAnn();
  $('logoutBtn').onclick=async function(ev){
    ev.preventDefault();
    var headers={'Content-Type':'application/json'};
    var csrf=getCsrfToken();
    if(csrf) headers['X-CSRF-Token']=csrf;
    try{await fetch('/api/auth/logout',{method:'POST',headers:headers,credentials:'include'});}catch(e){}
    window.location.href='../panel.html';
  };
  $('ab').onclick=openForm;$('fc').onclick=function(){cm('fm');};
  $('ef').onsubmit=handleSubmit;
  $('srch').oninput=function(){debounce(render,300);};$('cf').onchange=render;
  var mxs=document.querySelectorAll('.mx');for(var i=0;i<mxs.length;i++)mxs[i].onclick=function(){cm('fm');};
  window.onclick=function(e){if(e.target.classList.contains('mod'))cm('fm');};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')cm('fm');
  });
});
var dt=null;function debounce(fn,t){if(dt)clearTimeout(dt);dt=setTimeout(fn,t);}
async function loadAnn(){
  $('ag').innerHTML='<div class="state spin"><i class="fas fa-spinner"></i><p>Memuat pengumuman...</p></div>';
  var ok=false;
  try{
    var r=await fetch('/api/announcements',{credentials:'include'});
    if(r.status===401||r.status===403){$('ag').innerHTML='<div class="ne"><i class="fas fa-exclamation-triangle"></i><p>Anda perlu login untuk melihat pengumuman.</p></div>';return;}
    if(!r.ok){$('ag').innerHTML='<div class="ne"><i class="fas fa-exclamation-triangle"></i><p>Gagal memuat pengumuman.</p></div>';return;}
    var d=await r.json();an=d.announcements||d||[];ok=true;
  }catch(e){$('ag').innerHTML='<div class="ne"><i class="fas fa-exclamation-triangle"></i><p>Koneksi gagal. Periksa jaringan Anda.</p></div>';}
  finally{if(ok)render();}
}
function render(){
  var q=$('srch').value.toLowerCase(),c=$('cf').value,f=an;
  if(q)f=f.filter(function(a){return a.title.toLowerCase().indexOf(q)>=0||(a.content||'').toLowerCase().indexOf(q)>=0;});
  if(c)f=f.filter(function(a){return a.category===c;});
  var p=f.filter(function(a){return a.is_pinned;}),np=f.filter(function(a){return!a.is_pinned;});
  p.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
  np.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
  f=p.concat(np);var ia=isAdmin(),h='';
  if(f.length===0)h='<div class="ne"><i class="far fa-bullhorn"></i><p>Tidak ada pengumuman</p></div>';
  else for(var i=0;i<f.length;i++){
    var a=f[i],pi=a.is_pinned?' <i class="fas fa-thumbtack" style="color:#1a237e;font-size:.8rem"></i>':'';
    var ct=a.content&&a.content.length>200?a.content.substring(0,200)+'...':(a.content||'');
    var ds=new Date(a.created_at).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric'});
    h+='<div class="an-card'+(a.is_pinned?' pin':'')+'">';
    h+='<div class="an-h"><h3 class="an-t">'+a.title+pi+'</h3><div class="an-m"><span class="cat">'+a.category+'</span></div>';
    h+='<div class="an-b"><div class="an-c">'+ct+'</div>';
    h+='<div class="an-m"><i class="far fa-user"></i> '+(a.created_by_name||'Admin')+' <i class="far fa-clock"></i> '+ds;
    if(a.pdf_url)h+=' <a href="'+a.pdf_url+'" target="_blank" style="margin-left:auto;color:#1a237e;font-size:.8rem"><i class="fas fa-file-pdf"></i> '+(a.pdf_name||'PDF')+'</a>';
    h+='</div>';
    if(ia){
      h+='<div class="an-f">';
      h+='<button class="btn-sm" onclick="editAnn('+a.id+')"><i class="fas fa-edit"></i> Edit</button>';
      h+='<button class="pin-b" onclick="toPin('+a.id+')"><i class="fas '+(a.is_pinned?'fa-thumbtack':'fa-thumbtack')+'"></i> '+(a.is_pinned?'Unpin':'Pin')+'</button>';
      h+='<button class="btn-sm" onclick="delAnn('+a.id+')" style="color:#c62828"><i class="fas fa-trash"></i></button>';
      h+='</div>';
    }
    h+='</div>';
    h+='</div>';
    h+='</div>';
  }
  $('ag').innerHTML=h;
}
function $A(i){return document.getElementById(i)}
function om(id){var el=$A(id);if(el){el.classList.add('show');document.body.classList.add('modal-open');}}
function cm(id){var el=$A(id);if(el)el.classList.remove('show');if(!document.querySelector('.mod.show')){document.body.classList.remove('modal-open');}}
function editAnn(id){
  var a=null;for(var i=0;i<an.length;i++){if(an[i].id===id){a=an[i];break}}
  if(!a)return;if(!isAdmin())return;
  $('ei').value=a.id;$('et').value=a.title;$('ec').value=a.content;$('ecc').value=a.category;$('ep').checked=a.is_pinned;
  $('ft').textContent='Edit Pengumuman';$('fsb').textContent='Perbarui';om('fm');
}
function openForm(){
  if(!isAdmin())return;
  $('ei').value='';$('et').value='';$('ec').value='';$('ecc').value='Umum';$('ep').checked=false;
  $('ft').textContent='Pengumuman Baru';$('fsb').textContent='Simpan';om('fm');
}
function resetAnnForm(){$('ei').value='';$('et').value='';$('ec').value='';$('ecc').value='Umum';$('ep').checked=false;}
async function handleSubmit(e){
  e.preventDefault();var id=$('ei').value,data={title:$('et').value,content:$('ec').value,category:$('ecc').value,is_pinned:$('ep').checked};
  if(!isAdmin()){toast('Anda tidak memiliki izin untuk menyimpan pengumuman','err');return;}
  var btn=$('fsb'),orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
  try{var url='/api/announcements'+(id?'/'+id:''),method=id?'PUT':'POST';
    var headers={'Content-Type':'application/json'};var csrf=getCsrfToken();if(csrf)headers['X-CSRF-Token']=csrf;
    var r=await fetch(url,{method,headers,body:JSON.stringify(data),credentials:'include'});
    if(r.ok){cm('fm');resetAnnForm();toast(id?'Pengumuman berhasil diperbarui.':'Pengumuman berhasil dibuat.');await loadAnn();}else{var e2=await r.json();toast(e2.error||'Gagal','err');}
  }catch(e){toast('Terjadi kesalahan koneksi','err');}
  finally{btn.disabled=false;btn.innerHTML=orig;}
}
async function toPin(id){
  if(!isAdmin()){toast('Anda tidak memiliki izin untuk menyematkan pengumuman','err');return;}
  try{var headers={};var csrf=getCsrfToken();if(csrf)headers['X-CSRF-Token']=csrf;
    var r=await fetch('/api/announcements/'+id+'/pin',{method:'PATCH',headers:headers,credentials:'include'});var d=await r.json();
    if(r.ok){toast(d.message);await loadAnn();}else{toast(d.error||'Gagal','err');}
  }catch(e){toast('Terjadi kesalahan koneksi','err');}
}
async function delAnn(id){
  if(!isAdmin()){toast('Anda tidak memiliki izin untuk menghapus pengumuman','err');return;}
  if(!confirm('Hapus pengumuman ini?'))return;
  try{var headers={};var csrf=getCsrfToken();if(csrf)headers['X-CSRF-Token']=csrf;
    var r=await fetch('/api/announcements/'+id,{method:'DELETE',headers:headers,credentials:'include'});
    if(r.ok){toast('Pengumuman berhasil dihapus.');await loadAnn();}else{var d=await r.json();toast(d.error||'Gagal','err');}
  }catch(e){toast('Terjadi kesalahan koneksi','err');}
}
function toast(m,t){var o=$('toast');o.textContent=m;o.className='toast'+(t==='err'?' err':'')+' show';setTimeout(function(){o.classList.remove('show');},3000);}
</script>
<script src="/assets/js/announcement-popup.js"></script>
</body>
</html>
